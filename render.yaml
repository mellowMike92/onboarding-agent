# Render blueprint — deploys the FastAPI backend as a web service.
# Dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: onboarding-agent-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Set to your deployed frontend origin (e.g. https://your-app.vercel.app)
      - key: CORS_ORIGINS
        sync: false
      # Optional — omit/leave empty for deterministic mock agent mode
      - key: ANTHROPIC_API_KEY
        sync: false
